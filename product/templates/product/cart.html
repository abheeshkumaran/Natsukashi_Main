{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Natsukashi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #faf8f5; color: #333; }
        .container { max-width: 960px; margin-top: 40px; }
        .cart-row { display: flex; gap: 18px; padding: 18px; background: #fff; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 18px; }
        .cart-item-img { width: 140px; height: 180px; object-fit: cover; border-radius: 14px; border: 1px solid #eee; }
        .cart-item-info { flex: 1; }
        .item-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
        .item-type { color: #888; margin-bottom: 10px; }
        .price-block { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .item-price { color: #c91f2f; font-weight: 700; }
        .item-mrp { color: #999; text-decoration: line-through; }
        .item-off { color: #388e3c; font-weight: 700; }
        .qty-stepper { display: inline-flex; align-items: center; border: 1px solid #dcdcdc; border-radius: 6px; overflow: hidden; }
        .qty-stepper button { width: 34px; height: 34px; border: none; background: #f5f5f5; font-size: 16px; cursor: pointer; }
        .qty-stepper span { width: 40px; text-align: center; font-weight: 600; }
        .item-actions a { color: #c91f2f; text-decoration: none; font-weight: 700; }
        .item-actions a:hover { text-decoration: underline; }
        .summary-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .summary-total { font-size: 1.15rem; font-weight: 700; }
        .empty-state { text-align: center; background: #fff; padding: 60px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .btn-primary { background: #c91f2f; border: none; }
        .btn-primary:hover { background: #a51725; }
        a.site-link { color: #c91f2f; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Cart</h1>
        <p class="text-muted">Review your items and update quantities before checkout.</p>

        <div id="cartPageItems"></div>
        <div id="cartPageEmpty" class="empty-state" style="display:none;">
            <h4>Your cart is empty</h4>
            <p class="mb-4">Add items to the cart to get started.</p>
            <a href="{% url 'home' %}" class="site-link">Continue shopping</a>
        </div>

        <div id="cartPageSummary" class="summary-card" style="display:none;">
            <div class="summary-row"><span>Items</span><span id="cartPageItemCount">0</span></div>
            <div class="summary-row"><span>MRP Total</span><span id="cartPageMrpTotal">₹0.00</span></div>
            <div class="summary-row"><span>You Save</span><span id="cartPageDiscount">− ₹0.00</span></div>
            <div class="summary-row summary-total"><span>Total</span><span id="cartPageTotal">₹0.00</span></div>
            <p id="cartPageSavings" class="text-success mb-0"></p>
            <button class="btn btn-primary mt-4">Proceed to Checkout</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/cart.js' %}?v=3"></script>
</body>
</html>
