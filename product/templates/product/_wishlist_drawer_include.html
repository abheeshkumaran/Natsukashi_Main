<!-- Shared wishlist drawer: include once per page, alongside
     _cart_drawer_include.html. Reuses the cart drawer's CSS classes
     (cart-overlay/cart-drawer/cart-row/...) so the panel chrome matches
     exactly, with its own ids so cart and wishlist stay independent. -->

<div id="wishlistOverlay" class="cart-overlay" onclick="closeWishlistDrawer()"></div>

<div id="wishlistDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
        <span class="cart-drawer-title">My Wishlist (<span id="wishlistItemCount">0</span>)</span>
        <button class="cart-drawer-close" onclick="closeWishlistDrawer()">&times;</button>
    </div>

    <div class="cart-drawer-items">
        <div id="wishlistItems"></div>
        <div id="wishlistEmpty" class="cart-drawer-empty" style="display:none;">
            <span class="empty-icon">♡</span>
            <p class="mb-0">Your wishlist is empty</p>
        </div>
    </div>
</div>
