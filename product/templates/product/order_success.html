{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - Natsukashi</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}?v=1.2" rel="stylesheet">
    <style>
        .success-container { max-width: 600px; margin: 100px auto; padding: 0 15px; text-align: center; }
        .success-card { background: #fff; border-radius: 16px; padding: 50px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .success-icon { width: 80px; height: 80px; background: #e8f5e9; color: #4caf50; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }
        .success-title { font-family: var(--heading-font); color: var(--primary-color); font-weight: 700; margin-bottom: 15px; }
        .success-text { color: var(--text-color); font-size: 1.1rem; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h1 class="success-title">Order Placed Successfully!</h1>
            <p class="success-text">Thank you for shopping with Natsukashi. Your order has been received and your shipping details have been securely saved.</p>
            <a href="{% url 'home' %}" class="btn-primary-custom d-inline-block">Continue Shopping</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% include 'product/_report_issue_include.html' %}
</body>
</html>
