{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Natsukashi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        .checkout-container { max-width: 800px; margin: 60px auto; padding: 0 15px; }
        .checkout-card { background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .checkout-title { font-family: var(--heading-font); color: var(--primary-color); font-weight: 700; margin-bottom: 30px; text-align: center; }
        .form-label { font-weight: 500; color: var(--text-color); margin-bottom: 8px; font-size: 0.95rem; }
        .form-control { border-radius: 8px; border: 1px solid var(--border-color); padding: 12px 15px; font-size: 0.95rem; }
        .form-control:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 0.2rem rgba(184, 134, 59, 0.15); }
        .section-title { font-family: var(--heading-font); color: var(--secondary-color); font-size: 1.3rem; margin: 30px 0 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .btn-checkout { background: var(--primary-color); color: #fff; border: none; padding: 15px 30px; font-weight: 600; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; width: 100%; margin-top: 30px; transition: 0.3s; }
        .btn-checkout:hover { background: var(--hover-gold); color: #fff; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'images/Natsukashii_logo.png' %}" alt="Natsukashi" class="navbar-logo">
            </a>
            <div class="ms-auto">
                <a href="{% url 'home' %}" class="btn btn-outline-dark" style="border-radius: 20px; padding: 5px 20px;">Back to Shop</a>
            </div>
        </div>
    </nav>

    <div class="checkout-container">
        <div class="checkout-card">
            <h1 class="checkout-title">Secure Checkout</h1>
            
            <form action="{% url 'checkout' %}" method="POST" id="checkoutForm">
                {% csrf_token %}
                <input type="hidden" name="cart_data" id="cartDataInput">
                
                <h3 class="section-title mt-0">Personal Information</h3>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required value="{{ user_data.full_name|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" name="mobile_number" class="form-control" required value="{{ user_data.mobile_number|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email_address" class="form-control" required value="{{ user_data.email_address|default:'' }}">
                    </div>
                </div>

                <h3 class="section-title">Shipping Address</h3>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">House/Flat Number</label>
                        <input type="text" name="house_flat_number" class="form-control" required value="{{ user_data.house_flat_number|default:'' }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Street/Area</label>
                        <input type="text" name="street_area" class="form-control" required value="{{ user_data.street_area|default:'' }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Landmark (Optional)</label>
                        <input type="text" name="landmark" class="form-control" value="{{ user_data.landmark|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">City</label>
                        <input type="text" name="city" class="form-control" required value="{{ user_data.city|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">District</label>
                        <input type="text" name="district" class="form-control" required value="{{ user_data.district|default:'' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">State</label>
                        <input type="text" name="state" class="form-control" required value="{{ user_data.state|default:'' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Country</label>
                        <input type="text" name="country" class="form-control" required value="{{ user_data.country|default:'India' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">PIN Code</label>
                        <input type="text" name="pin_code" class="form-control" required value="{{ user_data.pin_code|default:'' }}">
                    </div>
                </div>

                <h3 class="section-title">Order Notes (Optional)</h3>
                <div class="row g-3">
                    <div class="col-12">
                        <textarea name="order_notes" class="form-control" rows="3" placeholder="Notes about your order, e.g. special notes for delivery.">{{ user_data.order_notes|default:'' }}</textarea>
                    </div>
                </div>

                <button type="submit" class="btn-checkout">Confirm & Place Order</button>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.SITE_USER_ID = "{% if request.session.site_user_id %}{{ request.session.site_user_id }}{% else %}{% endif %}";
    </script>
    <script src="{% static 'js/cart.js' %}?v=6"></script>
    <script>
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            // Get cart from localStorage and put it in the hidden input
            const key = (typeof window.SITE_USER_ID !== 'undefined' && window.SITE_USER_ID) 
                ? 'natsukashi_cart_' + window.SITE_USER_ID 
                : null;
            
            if (key) {
                const cartData = localStorage.getItem(key) || '[]';
                document.getElementById('cartDataInput').value = cartData;
            }

            // Clear the cart immediately upon form submission
            if (typeof saveCart === 'function') {
                saveCart([]);
            }
        });
    </script>
</body>
</html>
