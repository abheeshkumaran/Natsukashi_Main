<!-- Shared cart drawer: include once per page. Sits above the product-modal
     popup (see _product_modal_include.html) so "Go to Cart" always opens on
     top of it, with its own blurred backdrop. -->

<div id="cartOverlay" class="cart-overlay" onclick="closeCartDrawer()"></div>

<div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
        <span class="cart-drawer-title">My Cart (<span id="cartItemCount">0</span>)</span>
        <button class="cart-drawer-close" onclick="closeCartDrawer()">&times;</button>
    </div>

    <!-- Section 1: cart items -->
    <div class="cart-drawer-items">
        <div id="cartItems"></div>
        <div id="cartEmpty" class="cart-drawer-empty" style="display:none;">
            <span class="empty-icon">🛒</span>
            <p class="mb-0">Your cart is empty</p>
        </div>
    </div>

    <!-- Section 2: price details -->
    <div class="cart-drawer-summary" id="cartSummary" style="display:none;">
        <div class="price-details-title">Price Details</div>

        <div class="price-row">
            <span>Price (<span id="summaryItemCount">0</span> items)</span>
            <span id="cartMrpTotal">₹0.00</span>
        </div>

        <div class="price-row price-row-success">
            <span>Discount</span>
            <span id="cartDiscount">− ₹0.00</span>
        </div>

        <div class="price-row price-row-success">
            <span>Delivery Charges</span>
            <span>Free</span>
        </div>

        <div class="price-divider"></div>

        <div class="price-row total-row">
            <span>Total Amount</span>
            <span id="cartTotal">₹0.00</span>
        </div>

        <div class="savings-msg" id="savingsMsg"></div>

        <button class="btn-place-order" onclick="alert('Checkout is coming soon. Thank you for shopping with Natsukashi!')">Place Order</button>
    </div>
</div>

<style>
    .cart-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .3s ease;
        z-index: 1060;
    }

    .cart-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .cart-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 420px;
        max-width: 92vw;
        background: #fff;
        box-shadow: -8px 0 30px rgba(0, 0, 0, 0.18);
        z-index: 1070;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform .35s ease;
    }

    .cart-drawer.active {
        transform: translateX(0);
    }

    .cart-drawer-header {
        padding: 18px 22px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .cart-drawer-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #212121;
    }

    .cart-drawer-close {
        border: none;
        background: none;
        font-size: 28px;
        line-height: 1;
        color: #888;
        cursor: pointer;
    }

    .cart-drawer-close:hover {
        color: #c91f2f;
    }

    /* Section 1: cart items */

    .cart-drawer-items {
        flex: 1;
        overflow-y: auto;
        padding: 6px 22px;
    }

    .cart-drawer-empty {
        text-align: center;
        padding: 70px 20px;
        color: #888;
    }

    .cart-drawer-empty .empty-icon {
        font-size: 50px;
        margin-bottom: 10px;
        display: block;
    }

    .cart-row {
        display: flex;
        gap: 14px;
        padding: 18px 0;
        border-bottom: 1px solid #f0f0f0;
    }

    .cart-row:last-child {
        border-bottom: none;
    }

    .cart-item-img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid #eee;
        flex-shrink: 0;
    }

    .cart-item-info {
        flex-grow: 1;
        min-width: 0;
    }

    .item-name {
        font-size: .92rem;
        font-weight: 600;
        color: #212121;
    }

    .item-type {
        color: #878787;
        font-size: .78rem;
        margin-top: 2px;
    }

    .price-block {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        flex-wrap: wrap;
    }

    .item-price {
        font-size: .98rem;
        font-weight: 700;
        color: #212121;
    }

    .item-mrp {
        color: #878787;
        text-decoration: line-through;
        font-size: .82rem;
    }

    .item-off {
        color: #388e3c;
        font-weight: 600;
        font-size: .8rem;
    }

    .qty-stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid #dcdcdc;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .qty-stepper button {
        width: 28px;
        height: 28px;
        border: none;
        background: #f5f5f5;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
    }

    .qty-stepper button:hover {
        background: #eaeaea;
    }

    .qty-stepper span {
        width: 34px;
        text-align: center;
        font-weight: 600;
        font-size: .88rem;
    }

    .item-actions a {
        color: #c91f2f;
        text-transform: uppercase;
        font-weight: 700;
        font-size: .76rem;
        letter-spacing: .3px;
        text-decoration: none;
        cursor: pointer;
    }

    .item-actions a:hover {
        text-decoration: underline;
    }

    /* Section 2: price details */

    .cart-drawer-summary {
        border-top: 1px solid #eee;
        padding: 18px 22px 22px;
        background: #fafafa;
        flex-shrink: 0;
    }

    .price-details-title {
        text-transform: uppercase;
        color: #878787;
        font-weight: 700;
        font-size: .8rem;
        letter-spacing: .5px;
        margin-bottom: 14px;
    }

    .price-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: .9rem;
        color: #212121;
    }

    .price-row.price-row-success span {
        color: #388e3c;
    }

    .price-divider {
        border-top: 1px dashed #ccc;

    }

    .total-row {

    }

    .savings-msg {

        margin-bottom: 16px;
    }

    .btn-place-order {
        width: 100%;
        background: #c91f2f;
        color: #fff;
        border: none;
        font-weight: 700;
        letter-spacing: .5px;
        padding: 13px;
        border-radius: 6px;
        transition: .2s;
        text-transform: uppercase;
    }

    .btn-place-order:hover {
        background: #a51725;
        color: #fff;
    }

    @media (max-width: 575px) {
        .cart-drawer {

            max-width: 100vw;
        }
    }
</style>
