{% load static %}
<!-- Auth Modal Popup for "Buy Now" & Navbar -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content auth-modal-content">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="resetAuthForms()"></button>
            </div>
            <div class="modal-body text-center pt-0 px-5 pb-5">
                <img src="{% static 'images/Natsukashii_logo.png' %}" alt="Natsukashi" style="max-height: 80px; margin-bottom: 10px;">
                
                <!-- Login Form Container -->
                <div id="loginFormContainer">
                    <h3 class="auth-modal-title mb-2">Welcome Back</h3>
                    <p class="text-muted small mb-4">Please enter your details to log in.</p>
                    <div id="loginErrorMsg" class="alert alert-danger" style="display: none; font-size: 0.9rem;"></div>
                    
                    <form id="loginForm" class="text-start auth-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Phone Number / Email</label>
                            <input type="text" name="email" class="form-control custom-input" placeholder="Enter your email or phone" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Password</label>
                            <input type="password" name="password" class="form-control custom-input" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn auth-btn-primary w-100 mb-3">Log In</button>
                        
                        <div class="text-center mt-3">
                            <p class="text-muted small mb-0">Don't have an account? <a href="javascript:void(0)" class="auth-link" onclick="toggleAuthForm('register')">Register here</a></p>
                        </div>
                    </form>
                </div>

                <!-- Register Form Container (Hidden initially) -->
                <div id="registerFormContainer" style="display: none;">
                    <h3 class="auth-modal-title mb-2">Create Account</h3>
                    <p class="text-muted small mb-4">Join Natsukashi for a premium experience.</p>
                    
                    <form action="{% url 'register' %}" method="POST" class="text-start auth-form" id="registerForm" onsubmit="return validateRegisterForm()">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Name</label>
                            <input type="text" name="name" class="form-control custom-input" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Place</label>
                            <input type="text" name="place" class="form-control custom-input" placeholder="Enter your city or place" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Email</label>
                                <input type="email" name="email" class="form-control custom-input" placeholder="Email address" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Phone Number</label>
                                <input type="tel" name="phone" class="form-control custom-input" placeholder="Phone number" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Create Password</label>
                                <input type="password" name="password" id="regPassword" class="form-control custom-input" placeholder="Password" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-muted small fw-bold">Confirm Password</label>
                                <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control custom-input" placeholder="Confirm" required>
                            </div>
                        </div>
                        <button type="submit" class="btn auth-btn-primary w-100 mb-3">Register</button>
                        
                        <div class="text-center mt-3">
                            <p class="text-muted small mb-0">Already have an account? <a href="javascript:void(0)" class="auth-link" onclick="toggleAuthForm('login')">Log In here</a></p>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    .auth-modal-content {
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        transition: height 0.3s ease;
    }
    .auth-modal-title {
        font-family: var(--heading-font);
        color: var(--primary-color);
        font-weight: 700;
        font-size: 1.8rem;
    }
    .custom-input {
        border-radius: 8px;
        border: 1px solid var(--border-color);
        padding: 10px 15px;
        background-color: #fff;
        font-size: 0.9rem;
    }
    .custom-input:focus {
        border-color: var(--secondary-color);
        box-shadow: 0 0 0 0.2rem rgba(184, 134, 59, 0.15);
    }
    .auth-btn-primary {
        background: var(--primary-color);
        color: #fff;
        border: 1px solid var(--primary-color);
        padding: 12px 20px;
        font-weight: 600;
        border-radius: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: 0.3s;
    }
    .auth-btn-primary:hover {
        background: var(--hover-gold);
        border-color: var(--hover-gold);
        color: #fff;
    }
    .auth-link {
        color: var(--secondary-color);
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
    }
    .auth-link:hover {
        color: var(--primary-color);
        text-decoration: underline;
    }
</style>

<script>
    function openAuthModal() {
        const authModalEl = document.getElementById('authModal');
        if (authModalEl) {
            const modal = bootstrap.Modal.getOrCreateInstance(authModalEl);
            modal.show();
        }
    }
    
    function toggleAuthForm(formType) {
        const loginForm = document.getElementById('loginFormContainer');
        const registerForm = document.getElementById('registerFormContainer');
        
        if (formType === 'register') {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        } else {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
        }
    }
    
    function resetAuthForms() {
        // Reset to login form whenever the modal is closed
        setTimeout(() => {
            toggleAuthForm('login');
            const loginForm = document.getElementById('loginForm');
            if (loginForm) loginForm.reset();
            const registerForm = document.getElementById('registerForm');
            if (registerForm) registerForm.reset();
            const errorMsg = document.getElementById('loginErrorMsg');
            if (errorMsg) errorMsg.style.display = 'none';
        }, 300); // Wait for modal slide out animation to finish
    }

    function validateRegisterForm() {
        const pwd = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirmPassword').value;
        if (pwd !== confirm) {
            alert('Passwords do not match! Please try again.');
            return false;
        }
        return true;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                const errorMsg = document.getElementById('loginErrorMsg');
                errorMsg.style.display = 'none';
                
                fetch("{% url 'login' %}", {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.reload();
                    } else {
                        errorMsg.textContent = data.error;
                        errorMsg.style.display = 'block';
                    }
                })
                .catch(error => {
                    errorMsg.textContent = "An error occurred. Please try again.";
                    errorMsg.style.display = 'block';
                });
            });
        }

        window.IS_USER_LOGGED_IN = {% if request.session.site_user_name %}true{% else %}false{% endif %};
        window.SITE_USER_ID = "{% if request.session.site_user_id %}{{ request.session.site_user_id }}{% else %}{% endif %}";

        // Use capture phase (true) to intercept clicks for 'Buy Now'
        document.body.addEventListener('click', function(e) {
            const btn = e.target.closest ? e.target.closest('button') : null;
            if (btn) {
                const text = btn.textContent.trim().toLowerCase();
                const isBuyNow = text === 'buy now';
                
                if (isBuyNow && !btn.disabled) {
                    if (!window.IS_USER_LOGGED_IN) {
                        e.preventDefault();
                        e.stopPropagation();
                        openAuthModal();
                    }
                }
            }
        }, true);
        
        const authModalEl = document.getElementById('authModal');
        if (authModalEl) {
            authModalEl.addEventListener('hidden.bs.modal', function () {
                resetAuthForms();
            });
        }
    });
</script>
