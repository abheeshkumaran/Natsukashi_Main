{% load static %}
<!-- Full-screen splash shown once per browser session (via sessionStorage),
     right after <body> opens on every main storefront page. Logo grows in
     with a fade, holds briefly, then the whole overlay fades out once the
     page has finished loading and removes itself from the DOM so it never
     blocks clicks/scroll afterward. -->
<div id="splashScreen" class="splash-screen">
    <img src="{% static 'images/splash_logo.png' %}" alt="Natsukashi" class="splash-logo">
</div>

<style>
    .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.6s ease;
    }

    .splash-screen.splash-hidden {
        opacity: 0;
        pointer-events: none;
    }

    .splash-logo {
        width: 220px;
        max-width: 60vw;
        height: auto;
        opacity: 0;
        transform: scale(0.6);
        animation: splash-grow-in 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes splash-grow-in {
        0% { opacity: 0; transform: scale(0.6); }
        60% { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
    }
</style>

<script>
    (function () {
        var splash = document.getElementById('splashScreen');
        if (!splash) return;

        // Only once per browser session - internal navigation between pages
        // shouldn't replay it every time, just the first arrival.
        if (sessionStorage.getItem('natsukashiSplashShown')) {
            splash.remove();
            return;
        }
        sessionStorage.setItem('natsukashiSplashShown', '1');

        function hideSplash() {
            splash.classList.add('splash-hidden');
            setTimeout(function () { splash.remove(); }, 700);
        }

        // Let the logo's own grow-in animation (~1s) finish and hold
        // briefly before the whole overlay starts fading out.
        if (document.readyState === 'complete') {
            setTimeout(hideSplash, 1200);
        } else {
            window.addEventListener('load', function () {
                setTimeout(hideSplash, 1200);
            });
        }
    })();
</script>
