{% extends 'admin/admin_base.html' %}
{% block content %}
    <div class="container-fluid py-2">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Edit User</h2>
                    <a href="{% url 'list_users' %}" class="btn btn-outline-secondary">Back to Users</a>
                </div>
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form method="POST" action="">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Name</label>
                                <input type="text" name="name" class="form-control" value="{{ site_user.name }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ site_user.email }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="text" name="phone" class="form-control" value="{{ site_user.phone }}" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2">Update User Details</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
{% endblock %}
