{% extends 'admin/admin_base.html' %}
{% block content %}
<div class="container-fluid py-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Profile</h2>
    </div>

    <div class="bg-white rounded shadow-sm p-4 mb-4" style="max-width: 500px;">
        <h5 class="fw-bold mb-3">Account</h5>
        <p class="text-muted mb-0">Logged in as <strong>{{ request.user.username }}</strong></p>
    </div>

    <div class="bg-white rounded shadow-sm p-4" style="max-width: 500px;">
        <h5 class="fw-bold mb-3">Change Password</h5>

        {% if password_error %}
        <div class="alert alert-danger">{{ password_error }}</div>
        {% endif %}
        {% if password_success %}
        <div class="alert alert-success">Password updated successfully.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Old Password</label>
                <input type="password" name="old_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="8">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
