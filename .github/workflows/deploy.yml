name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# id-token: write is required for OIDC - this is what lets AWS trust this
# workflow run without any long-lived AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# stored as a GitHub secret. See deploy/CICD.md for the one-time AWS setup.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger deploy.sh on the server via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SSM_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy - ${{ github.sha }}" \
            --parameters 'commands=["sudo -u ubuntu -i /home/ubuntu/Natsukashi_Main/deploy/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered SSM command: $COMMAND_ID"

      - name: Wait for deploy to finish and stream logs
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ vars.SSM_INSTANCE_ID }}"

          echo "Waiting for command $COMMAND_ID..."
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  [$i/60] status=$STATUS"
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" && "$STATUS" != "Delayed" ]]; then
              break
            fi
            sleep 5
          done

          echo ""
          echo "===== deploy.sh stdout ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          echo ""
          echo "===== deploy.sh stderr ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo ""
          echo "Final status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy failed (SSM status: $STATUS) - see stderr above"
            exit 1
          fi
