# Copy to /etc/nginx/sites-available/natsukashi, then:
#   sudo ln -s /etc/nginx/sites-available/natsukashi /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Once a domain + certbot cert are in place, run:
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 20M;

    location /static/ {
        alias /home/ubuntu/Natsukashi_Main/staticfiles_build/static/;
    }

    location / {
        proxy_pass http://unix:/home/ubuntu/Natsukashi_Main/natsukashi.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
